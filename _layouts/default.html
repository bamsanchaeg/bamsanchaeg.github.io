<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172a46">
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 155 }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body id="top">
    <a class="skip-link" href="#content">본문 바로가기</a>
    <div class="page-shell">
      {% include header.html %}
      <main id="content">{{ content }}</main>
      {% include footer.html %}
    </div>
  </body>
</html>
