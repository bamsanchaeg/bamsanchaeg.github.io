---
layout: default
---

<article class="post-view">
  <header class="post-header">
    <a class="back-link" href="{{ '/archive/' | relative_url }}">← Archive</a>
    <div class="post-meta">
      <span>{{ page.category | default: "기록" }}</span>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
    </div>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="post-body">{{ content }}</div>

  {% if page.tags %}
    <footer class="post-footer" aria-label="태그">
      {% for tag in page.tags %}<span>#{{ tag }}</span>{% endfor %}
    </footer>
  {% endif %}
</article>
