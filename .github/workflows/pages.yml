# main 에 올리면 게임 파일 하나(village.html → index.html)만 GitHub Pages 에 배포한다
name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 비밀 값 검사 (모든 커밋)
        run: python3 tools/check_secrets.py --all
      - name: 묶은 파일이 원본과 같은지 확인
        run: |
          python3 tools/build_skku.py
          git diff --exit-code -- prototype/village.html
      - name: 배포할 파일 모으기
        run: |
          mkdir _site
          cp prototype/village.html _site/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
