# main 에 올리면 게임 파일(village.html → index.html)과 배경음악(audio/)만 GitHub Pages 에 배포한다
name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 비밀 값 검사 (모든 커밋)
        run: python3 tools/check_secrets.py --all
      - name: 묶은 파일이 원본과 같은지 확인
        run: |
          python3 tools/build_skku.py
          git diff --exit-code -- prototype/village.html
      - name: 배포할 파일 모으기
        run: |
          mkdir _site
          cp prototype/village.html _site/index.html
          mkdir _site/audio
          cp prototype/audio/*.mp3 _site/audio/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
